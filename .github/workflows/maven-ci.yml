name: Java CI with Maven Coverage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build, Test and Verify Coverage with Maven
        working-directory: ./Bai05
        run: mvn -B verify

      - name: Upload built JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: banksystem-jar
          path: Bai05/target/*.jar

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: Bai05/target/site/jacoco/