name: Automated PR Code Review

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  review-and-test:
    name: Checkstyle & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Checkstyle, Tests and Coverage
        working-directory: ./Bai07
        run: mvn -B verify

      - name: Run Checkstyle Inline Review
        if: always()
        uses: dbelyaev/action-checkstyle@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_report_path: Bai07/target/checkstyle-result.xml
          reporter: github-pr-review
          fail_on_error: true